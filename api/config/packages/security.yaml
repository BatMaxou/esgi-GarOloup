security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        user_provider:
            entity:
                class: App\Entity\User\User
                property: email
        temp_user_provider:
            entity:
                class: App\Entity\User\TempUser
                property: id
        player_provider:
            chain:
                providers: [user_provider, temp_user_provider]

    firewalls:
        login:
            pattern: ^/api/login
            provider: user_provider
            stateless: true
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        refresh_token:
            pattern: ^/api/token/refresh
            provider: player_provider
            refresh_jwt:
                check_path: /api/token/refresh

        player:
            pattern: ^/api/(temp_user|me|game)
            provider: player_provider
            stateless: true
            entry_point: jwt
            jwt: ~

        public:
            pattern: ^/api/public

        api:
            pattern: ^/api
            provider: user_provider
            stateless: true
            entry_point: jwt
            jwt: ~

        dev:
            pattern: ^/_(profiler|wdt)
            security: false

    access_control:
        - { path: ^/api/(login|temp_user|register|forgot_password|reset_password)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/roles, methods: GET, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
