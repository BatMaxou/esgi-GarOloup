security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        user_provider:
            entity:
                class: App\Entity\User
                property: email
        temp_user_provider:
            entity:
                class: App\Entity\TempUser
                property: id
        player_provider:
            chain:
                providers: [user_provider, temp_user_provider]

    firewalls:
        login:
            pattern: ^/api/login
            provider: user_provider
            stateless: true
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        temp_user:
            pattern: ^/api/temp_user
            provider: player_provider
            stateless: true
            entry_point: jwt
            jwt: ~

        refresh_token:
            pattern: ^/api/token/refresh
            provider: player_provider
            refresh_jwt:
                check_path: /api/token/refresh

        game:
            pattern: ^/api/game
            provider: player_provider
            stateless: true
            entry_point: jwt
            jwt: ~

        api:
            pattern: ^/api
            provider: user_provider
            stateless: true
            entry_point: jwt
            jwt: ~

        # Add pattern for endpoints of homepage and role presentations

        dev:
            pattern: ^/_(profiler|wdt)
            security: false

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/game, methods: POST, roles: PUBLIC_ACCESS }
        - { path: ^/api/(user|game), roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
