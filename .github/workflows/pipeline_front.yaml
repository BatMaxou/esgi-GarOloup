name: Pipeline Front

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'front/**'
  pull_request:
    paths:
      - 'front/**'

jobs:
  linters:
    name: Front linters
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Docker up
        run: make up node

      - name: Build
        run: make front-build

      - name: Linter
        run: make front-lint
