<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GarOloup | Hors ligne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400..800&family=Miltonian+Tattoo&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2b2e44 0%, #1a1c2e 70%);
            color: #f8f8ff;
            font-family: 'Eczar', Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            gap: 1rem;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-family: 'Miltonian Tattoo', serif;
            font-size: 2.5rem;
            line-height: 3rem;
            color: #9f9ad6;
            text-shadow:
              0 0 32px rgba(159, 154, 214, 0.4),
              0 4px 12px rgba(26, 28, 46, 0.7);
        }

        @media (min-width: 24rem) {
            h1 {
                font-size: 4rem;
                line-height: 4.5rem;
            }
        }

        @media (min-width: 40rem) {
            h1 {
                font-size: 6.5rem;
                line-height: 7rem;
            }
        }

        p {
            color: #9ea0b8;
            max-width: 320px;
        }

        img {
            width: 96px;
            height: 96px;
        }

        @media (min-width: 40rem) {
            img {
                width: 160px;
                height: 160px;
            }
        }
    </style>
  </head>
  <body>
    <img src="/icon.svg" alt="GarOloup" />
    <h1>GarOloup</h1>
    <p>Vous êtes hors ligne. Connectez-vous pour rejoindre la partie.</p>
  </body>
</html>
