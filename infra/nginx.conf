server {
    server_name <mon-domaine.fr>;

    location /uploads {
        proxy_pass http://127.0.0.1:10111/uploads;
    }

    location /api/auth {
        proxy_pass http://127.0.0.1:10112;
    }

    location /api {
        proxy_pass http://127.0.0.1:10111;
    }

    location /.well-known/mercure {
        proxy_pass http://127.0.0.1:10113;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /catcher {
        proxy_pass http://127.0.0.1:10114;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:10112;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/<mon-domaine.fr>/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/<mon-domaine.fr>/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = <mon-domaine.fr>) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name <mon-domaine.fr>;
    listen 80;
    return 404; # managed by Certbot
}
